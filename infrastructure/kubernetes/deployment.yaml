# Bauimperium - Kubernetes Deployment (for larger scale)
apiVersion: v1
kind: Namespace
metadata:
  name: bauimperium
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bauimperium
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: bauimperium/backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bauimperium-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bauimperium-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-core
  namespace: bauimperium
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-core
  template:
    metadata:
      labels:
        app: ai-core
    spec:
      containers:
        - name: ai-core
          image: bauimperium/ai-core:latest
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-bauherren
  namespace: bauimperium
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-bauherren
  template:
    metadata:
      labels:
        app: frontend-bauherren
    spec:
      containers:
        - name: frontend
          image: bauimperium/frontend-bauherren:latest
          ports:
            - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-handwerker
  namespace: bauimperium
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-handwerker
  template:
    metadata:
      labels:
        app: frontend-handwerker
    spec:
      containers:
        - name: frontend
          image: bauimperium/frontend-handwerker:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: bauimperium
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-core-service
  namespace: bauimperium
spec:
  selector:
    app: ai-core
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-bauherren-service
  namespace: bauimperium
spec:
  selector:
    app: frontend-bauherren
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-handwerker-service
  namespace: bauimperium
spec:
  selector:
    app: frontend-handwerker
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bauimperium-ingress
  namespace: bauimperium
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - bauimperium.de
        - www.bauimperium.de
      secretName: bauimperium-tls
  rules:
    - host: bauimperium.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-bauherren-service
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: ai-core-service
                port:
                  number: 5000
    - host: handwerker.bauimperium.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-handwerker-service
                port:
                  number: 3000
